# EcoRDF configuration file
#
# Place this file in the store directory (e.g. ./ecordf-data/ecordf.toml)
# or pass an explicit path with --config <path>.
#
# All keys are optional. Missing keys fall back to the built-in defaults
# shown in the comments below.
#
# Command-line flags (--host, --port, --cors, --warmup-mb, --pred-cache-mb,
# --pred-cache-per-pred-cap-mb, --rdf-config, --path-cache-mb) override
# the corresponding [server] / [model] values.

# ── Index build tunables ─────────────────────────────────────────────────────

[build]

# Number of triples per sorted chunk during index build (external sort).
#
# During `ecordf build`, incoming triples are accumulated in memory up to this
# count, then sorted and flushed to a temporary file.  After all input is read,
# the chunk files are merged via a k-way merge (binary heap) into the final
# index.  This bounds peak memory to roughly:
#
#   chunk_size × 24 bytes × 3 indexes  (SPO + POS + OSP buffers, each term is u64)
#
# Approximate peak memory guide:
#   chunk_size       peak index-buffer RAM
#   ----------       ---------------------
#    1_000_000       ≈   72 MB
#    5_000_000       ≈  360 MB  ← default (conservative)
#   20_000_000       ≈ 1440 MB
#   50_000_000       ≈ 3600 MB
#  100_000_000       ≈ 7200 MB
#
# Larger values produce fewer chunk files and speed up the final index merge.
# Phase 2 (triple loading) runs after Phase 1 is complete, so dict_chunk_mb
# memory is already freed when chunk_size memory peaks.
#
# Hardware profiles:
#   8 GB  RAM / any threads  →   5_000_000   (360 MB, very safe)
#  16 GB  RAM / any threads  →  10_000_000   (720 MB)
#  32 GB  RAM / any threads  →  20_000_000  (1440 MB)
#  64 GB  RAM / 32 threads   →  50_000_000  (3600 MB)  ← recommended
# 128 GB  RAM / any threads  → 100_000_000  (7200 MB)
#
# Set to 0 to disable external sort entirely and load all triples into RAM
# before sorting — use this only on machines with tens of GB of free memory.
chunk_size = 5_000_000

# RAM budget (in MiB) for the string-collection buffer used in Phase 1 of
# the two-pass dictionary builder (active when chunk_size > 0).
#
# Strings are buffered in memory up to this size per thread, then sorted,
# deduped, and flushed to a temporary chunk file on disk.  All chunks are
# later k-way merged (in parallel across levels) without further heap
# allocation beyond I/O buffers.
#
# Peak Phase 1 RAM = dict_chunk_mb × parallel_threads
#
#   dict_chunk_mb    32 threads    16 threads    8 threads
#   -------------    ----------    ----------    ---------
#    50              ≈  1.6 GB     ≈  0.8 GB    ≈  0.4 GB
#   200              ≈  6.4 GB     ≈  3.2 GB    ≈  1.6 GB  ← default
#   500              ≈ 16.0 GB     ≈  8.0 GB    ≈  4.0 GB
#  1200              ≈ 38.4 GB     ≈ 19.2 GB    ≈  9.6 GB
#  1500              ≈ 48.0 GB     ≈ 24.0 GB    ≈ 12.0 GB
#
# Larger values reduce the number of chunk files (fewer merge batches) and
# speed up the merge phase significantly for large datasets like UniProt.
#
# Hardware profiles (leave ~6 GB for OS, mmap, and misc):
#   8 GB  RAM /  8 threads  →   200  (1.6 GB, safe)
#  16 GB  RAM / 16 threads  →   500  (8.0 GB)
#  32 GB  RAM / 32 threads  →   750  (24.0 GB)
#  64 GB  RAM / 32 threads  →  1200  (38.4 GB)  ← recommended
# 128 GB  RAM / 32 threads  →  1500  (48.0 GB, leaves 74 GB headroom)
dict_chunk_mb = 200

# Number of threads used during `ecordf build` for parallel file loading.
#
# Each thread handles one file at a time in Phase 1 (string collection) and
# Phase 2 (triple loading).  Per-thread RAM budgets are divided by this count,
# so total peak memory stays roughly constant regardless of parallelism.
#
#   parallel_threads    behaviour
#   ----------------    ---------
#   0                   all CPU cores (default, recommended)
#   1                   single-threaded  (debugging / memory profiling)
#   N                   exactly N threads
#
parallel_threads = 0

# ── Query execution tunables ──────────────────────────────────────────────────

[query]

# Maximum number of rows any intermediate result may hold.
#
# Protects against out-of-memory (OOM) on pathological queries such as
# unconstrained cross-joins over large datasets. When a join would push the row
# count past this limit, execution is aborted and an error is returned.
#
# Memory estimate (approximate):
#   max_intermediate_rows × ~40 bytes
#      1_000_000  →   ~40 MB
#      5_000_000  →  ~200 MB
#     50_000_000  → ~2000 MB ← default
#    100_000_000  → ~4000 MB
#
# Raise on servers with plentiful RAM and complex analytical queries.
# Lower on memory-constrained environments (containers, shared hosts).
max_intermediate_rows = 50_000_000

# Row threshold for choosing bind-join over hash-join.
#
# When the left-side result has ≤ this many rows AND the right-side plan does
# not need to be re-evaluated with left-side variable bindings, the executor
# uses bind-join: it probes the index once per left row, substituting the
# current binding. This lets the index prune based on the bound value and is
# typically faster than materialising the entire right side.
#
# When the left-side row count exceeds this threshold, hash-join is used
# instead (materialise both sides, probe with a hash map). Hash-join has lower
# latency for large, unconstrained right sides, but higher peak memory use.
#
# Raise if your queries produce moderate-to-large left results that still
# benefit from selective index probing (e.g. highly selective predicates).
# Lower to switch to hash-join earlier (lower peak memory, more scans).
bind_join_threshold = 10_000

# ── HTTP server defaults ──────────────────────────────────────────────────────

[server]

# Bind address for the SPARQL HTTP endpoint.
#
# "127.0.0.1" — loopback only; safe for local / development use.
# "0.0.0.0"   — all interfaces; required when serving over a network.
#
# Overridable with --host on the command line.
host = "127.0.0.1"

# TCP port for the SPARQL HTTP endpoint.
#
# Choose a port ≥ 1024 to avoid requiring root privileges.
# Common choices: 7878 (default), 8080, 3030.
#
# Overridable with --port on the command line.
port = 7878

# Maximum number of queries that may execute concurrently.
#
# Each query runs in tokio's blocking thread pool (spawn_blocking).
# This cap prevents a burst of slow queries from exhausting system resources.
#
#   0  — no limit; bounded only by tokio's blocking pool (default 512).
#   N  — at most N queries run in parallel; excess requests are queued.
#
# Rule of thumb: 2 × number_of_CPU_cores.
# Raise for short / I/O-bound queries.
# Lower for RAM-heavy analytical queries to avoid memory pressure.
max_concurrent_queries = 0

# Allowed CORS origins for the HTTP endpoint.
#
# Controls the Access-Control-Allow-Origin response header:
#
#   ""        — CORS disabled; no ACAO header is sent.
#               Use this for local or intranet deployments (safest).
#   "*"       — Allow any origin.  Convenient for public read-only APIs.
#               Do NOT use with authentication cookies or private data.
#   "https://app.example.com,https://other.example.com"
#             — Whitelist specific origins (comma-separated, no spaces).
#
# Overridable with --cors on the command line.
cors_origins = ""

# MiB of index data to read into the OS page cache in a background thread
# immediately after startup.
#
# EcoRDF uses memmap2 — index pages are loaded on first access.  For large
# stores the first few queries after a cold start can be slow due to page
# faults.  Setting warmup_mb > 0 pre-populates the page cache before any
# queries arrive, eliminating that initial latency.
#
# The budget is spread across SPO / POS / OSP / dict (and GSPO if present).
# POS receives a 2× share as the most-heavily-used index at query time.
#
#   warmup_mb    effect
#   ---------    ------
#   0            disabled — no warmup (default)
#   4096         warm 4 GB; good starting point for medium stores
#   16384        warm 16 GB; suitable for UniProt-scale datasets
#
# RAM note: warmed data goes into the OS page cache, NOT the process heap.
# Process RSS barely changes.  The kernel will evict pages under memory
# pressure automatically.
#
# Overridable with --warmup-mb on the command line (CLI value wins when > 0).
warmup_mb = 0

# RAM budget (MiB) for the in-memory predicate cache built at startup.
#
# At startup, EcoRDF loads the (subject, object) pairs for each predicate from
# the POS index into a sorted Vec<(TermId, TermId)> in RAM.  During query
# execution, instead of triggering HDD page faults for a full POS scan, the
# executor finds the predicate in the cache and performs a linear merge or
# binary search — pure RAM access.
#
# Predicates are loaded largest-first (most pairs first) so that the most
# expensive predicates (e.g. faldo:position, faldo:begin at 11.8 M entries each
# = 188 MB each on JPostDB) are guaranteed to be cached before smaller ones.
#
# The build is synchronous: the server does not accept queries until the cache
# is fully populated, so the very first query benefits from the cache.
#
# Memory layout: each cached pair is 16 bytes (two u64 IDs).
#   11.8 M pairs × 16 B = 188 MB  (e.g. faldo:position on JPostDB)
#
# Recommended values:
#   0      — disabled; all POS scans hit the HDD (default for minimal RAM usage)
#   1024   — covers faldo:begin + faldo:position on JPostDB (376 MB each with 50% cap)
#   2048   — leaves room for more predicates while staying within typical server RAM
#
# See also: pred_cache_per_pred_cap_mb below.
#
# Overridable with --pred-cache-mb on the command line (CLI value wins when > 0).
pred_cache_mb = 1024

# Per-predicate size cap (MiB) for the predicate cache.
#
# By default the per-predicate cap is pred_cache_mb / 2.  This works well in
# most cases, but can fail when two or more huge predicates each consume half the
# budget and leave no room for smaller predicates.
#
# Example (JPostDB, pred_cache_mb = 1024, default cap = 512 MB):
#   jpo:someHugePred  → 479 MB → fits under 512 MB cap → cached  ✓
#   jpo:anotherHuge   → 479 MB → fits under 512 MB cap → cached  ✓
#   (budget exhausted: 958 MB used of 1024 MB)
#   faldo:begin       → 188 MB → no room → NOT cached  ✗
#   faldo:position    → 188 MB → no room → NOT cached  ✗
#
# Setting pred_cache_per_pred_cap_mb = 200 changes the picture:
#   jpo:someHugePred  → 479 MB → exceeds 200 MB cap → SKIPPED
#   jpo:anotherHuge   → 479 MB → exceeds 200 MB cap → SKIPPED
#   faldo:begin       → 188 MB → fits → cached  ✓
#   faldo:position    → 188 MB → fits → cached  ✓
#   (budget used: 376 MB of 1024 MB; remaining budget fills smaller predicates)
#
# Rule of thumb: set to slightly above the size of your largest "useful"
# predicate (i.e. one that actually appears in your SPARQL queries).
#
#   0    — use pred_cache_mb / 2 (default behaviour)
#   200  — skip predicates larger than 200 MB; good starting point for JPostDB
#   500  — allow up to 500 MB per predicate
#
# Overridable with --pred-cache-per-pred-cap-mb on the command line.
pred_cache_per_pred_cap_mb = 0


# ── RDF model / schema hints ──────────────────────────────────────────────────

[model]

# List of rdf-config directories to load at startup for path-cache
# materialisation.
#
# Each entry is one of:
#   - A local directory path containing prefix.yaml and model.yaml
#   - A GitHub tree URL:  https://github.com/dbcls/rdf-config/tree/master/config/uniprot
#   - A GitHub blob URL:  https://github.com/dbcls/rdf-config/blob/master/config/uniprot
#
# EcoRDF reads prefix.yaml and model.yaml from each spec, extracts compound
# property paths (multi-hop predicate chains through blank nodes), and
# pre-materialises them in RAM so that SPARQL property-path queries can answer
# with a single RAM lookup instead of a multi-step HDD traversal.
#
# Example paths extracted from JPostDB model.yaml:
#   [faldo:begin, faldo:position]
#   [up:annotation, up:range, faldo:begin, faldo:position]
#
# Errors (network failures, missing files, parse errors) are logged at WARN
# level and skipped — the server starts regardless.
#
# Leave empty (default) to disable rdf-config loading.
# Overridable with --rdf-config on the command line (CLI list replaces this list).
#
# rdf_configs = [
#   "https://github.com/dbcls/rdf-config/tree/master/config/jpostdb",
#   "https://github.com/dbcls/rdf-config/tree/master/config/uniprot",
#   "/data/local-rdf-config/mydb",
# ]
rdf_configs = []

# RAM budget (MiB) for the path cache built from rdf_configs above.
#
# Each compound path is materialised as a sorted Vec<(TermId, TermId)> of all
# (start, end) pairs reachable through the full predicate chain.  Memory use
# depends on the number of reachable pairs:
#
#   pairs × 16 bytes = memory
#   11.8 M pairs     = 188 MB  (e.g. faldo:begin/faldo:position on JPostDB)
#
# When a path is in the cache, the executor uses bind_join with a binary search
# per left-side row — O(log M) RAM access — instead of a multi-step HDD scan.
# For a 508-entry left side, this reduces query time from ~5 s to ~50 µs.
#
# Set to 0 (default) to disable path materialisation even when rdf_configs is
# non-empty (useful if you want rdf-config parsing for other purposes later).
#
# Recommended values:
#   0    — disabled (default)
#   512  — covers one or two faldo-style paths on JPostDB
#   2048 — covers many paths for a large multi-dataset store
#
# Overridable with --path-cache-mb on the command line (CLI value wins when > 0).
path_cache_mb = 0
