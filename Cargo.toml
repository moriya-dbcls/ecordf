[package]
name = "ecordf"
version = "0.1.0"
edition = "2021"
authors = ["EcoRDF Project"]
description = """
EcoRDF: A cost-efficient RDF triple store.
  - memmap2-backed sorted indexes (OS-managed paging)
  - Leapfrog Triejoin (provably optimal multi-way join)
  - Cost-based query optimizer with histogram statistics
  - External-sort build: bounded RAM regardless of dataset size
"""

[[bin]]
name = "ecordf"
path = "src/main.rs"

[lib]
name = "ecordf"
path = "src/lib.rs"

[dependencies]
# Memory-mapped file I/O — the key to beating Qlever's memory usage.
# Advice::WillNeed (madvise) is used to pipeline disk I/O with CPU work.
memmap2 = "0.9"

# libc is used for madvise(MADV_DONTNEED) which is not exposed by memmap2 0.9.
libc = "0.2"

# Async HTTP server for SPARQL 1.1 Protocol endpoint
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization for SPARQL results (JSON/XML)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.31", features = ["serialize"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Fast hash map (for dictionary encoding)
rustc-hash = "1"

# Data-parallel processing for multi-file index build
rayon = "1"

# Regex support for SPARQL FILTER regex()
regex = "1"

# URL / form parsing
percent-encoding = "2"
form_urlencoded = "1"

# Error handling in main
anyhow = "1"

# Configuration file parsing
toml = "0.8"

# YAML parsing (for rdf-config model.yaml / prefix.yaml)
serde_yaml = "0.9"

# HTTP client for fetching rdf-config from GitHub URLs (sync, lightweight)
ureq = "2"

[features]
default = ["gzip"]
gzip = ["dep:flate2"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[dependencies.flate2]
version = "1"
optional = true

[[bench]]
name = "join_bench"
harness = false

[profile.release]
# Maximize performance for the hot path
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1  # Some optimization even in dev for numeric code
